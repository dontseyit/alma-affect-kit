name: release

# Builds the distribution on a version tag and verifies the tag
# matches the package version. Publishing to PyPI is disabled.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION="$(python -c 'import runpy; print(runpy.run_path("src/alma_affect_kit/_version.py")["__version__"])')"
          if [ "v${PKG_VERSION}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match _version.py (${PKG_VERSION})" >&2
            exit 1
          fi
      - run: pip install -e . pytest build twine
      - run: pytest -q
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
